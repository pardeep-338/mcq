version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - '5000:5000'
    environment:
      - MONGO_URI=mongodb://mongo:27017/upscquiz
      - JWT_SECRET=changeme
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    ports:
      - '3000:5173'
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
  mongo:
    image: mongo:6
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data:
